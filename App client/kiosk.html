<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoBooth Live View</title>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #000000;
      --accent: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.45);
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: default;
    }

    /* Main View Stage */
    .kiosk-stage {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      overflow: hidden;
    }

    /* Liveview Container Box: strictly sized to room/template aspect ratio */
    .liveview-container-box {
      position: relative;
      max-width: 100vw;
      max-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.85);
      transition: width 0.25s ease, height 0.25s ease;
    }

    /* Liveview Video & Canvas: Crisp Mirror View fitted inside target aspect ratio box */
    #liveview-video, #liveview-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1); /* Mirror view for natural reflection */
    }

    /* Live Overlay Frame on top of video */
    #live-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 10;
      display: none;
    }

    /* Viewfinder Framing Guide - Clean Studio Frame to align pose */
    .viewfinder-guide {
      position: absolute;
      inset: 4%;
      pointer-events: none;
      z-index: 14;
      transition: opacity 0.3s ease;
    }

    .guide-corner {
      position: absolute;
      width: 44px;
      height: 44px;
      border-color: rgba(255, 255, 255, 0.38);
      border-style: solid;
    }

    .guide-corner.tl { top: 0; left: 0; border-width: 3px 0 0 3px; border-top-left-radius: 12px; }
    .guide-corner.tr { top: 0; right: 0; border-width: 3px 3px 0 0; border-top-right-radius: 12px; }
    .guide-corner.bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-bottom-left-radius: 12px; }
    .guide-corner.br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-bottom-right-radius: 12px; }

    /* Fullscreen Toggle Button at Top-Right Corner */
    .btn-fullscreen-toggle {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(15, 23, 42, 0.82);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(14px);
      color: #ffffff;
      padding: 9px 18px;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-fullscreen-toggle:hover {
      background: rgba(244, 63, 94, 0.9);
      border-color: #f43f5e;
      transform: scale(1.06);
      box-shadow: 0 8px 30px rgba(244, 63, 94, 0.4);
    }

    .btn-fullscreen-toggle svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    /* Discreet Exit Button (Top-left corner, semi-invisible to subjects) */
    .discreet-exit-btn {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
      font-size: 1.3rem;
      cursor: pointer;
      z-index: 100;
      opacity: 0.15;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .discreet-exit-btn:hover {
      opacity: 1;
      background: rgba(244, 63, 94, 0.85);
      color: #ffffff;
      border-color: #f43f5e;
      transform: scale(1.05);
    }

    /* Camera Disconnection Warning Banner (Hidden unless error) */
    .camera-alert {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.9);
      backdrop-filter: blur(12px);
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 80;
      box-shadow: 0 6px 24px rgba(239, 68, 68, 0.4);
      animation: alertPulse 2s infinite ease-in-out;
    }

    @keyframes alertPulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.03); }
    }

    /* Screen States Layer */
    .screen-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: all 0.3s ease;
    }

    /* 1. Idle Screen: Completely Transparent Mirror View */
    #screen-idle {
      background: transparent; /* No tint so liveview mirror is 100% clear */
      cursor: pointer;
    }

    /* Sleek Bottom Shutter Bar (Out of face/torso framing area) */
    .bottom-touch-bar {
      position: absolute;
      bottom: 32px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 25;
    }

    .shutter-pill {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      padding: 12px 30px;
      border-radius: 9999px;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .shutter-pill:hover {
      transform: scale(1.06);
      background: rgba(244, 63, 94, 0.85);
      border-color: #f43f5e;
      box-shadow: 0 12px 35px rgba(244, 63, 94, 0.5);
    }

    .shutter-icon-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #f43f5e;
      box-shadow: 0 0 12px #f43f5e;
      transition: all 0.2s;
    }

    .shutter-pill:hover .shutter-icon-dot {
      background-color: #ffffff;
      box-shadow: 0 0 12px #ffffff;
    }

    /* 2. Countdown Screen: Positioned at Top-Center to completely clear subjects' faces and pose */
    #screen-countdown {
      display: none;
      pointer-events: none;
      background: transparent; /* Subject can still see themselves smiling during countdown */
      justify-content: flex-start; /* Move to top, keeping middle 100% unobstructed */
      padding-top: 26px;
    }

    .countdown-wrap {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      padding: 8px 26px 8px 10px;
      border-radius: 9999px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 24px var(--accent-glow);
      animation: countdownBarEnter 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes countdownBarEnter {
      0% { transform: translateY(-20px) scale(0.9); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .countdown-badge {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 18px rgba(244, 63, 94, 0.7), inset 0 2px 4px rgba(255, 255, 255, 0.45);
      flex-shrink: 0;
    }

    .countdown-number {
      font-size: 2.6rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      animation: countdownPop 1s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }

    @keyframes countdownPop {
      0% { transform: scale(1.35); }
      30% { transform: scale(1); }
      85% { transform: scale(1); }
      100% { transform: scale(0.92); }
    }

    .countdown-subtext {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      white-space: nowrap;
    }

    .lens-indicator-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background-color: #ef4444;
      box-shadow: 0 0 12px #ef4444;
      animation: blinkRed 0.8s infinite ease-in-out;
    }

    @keyframes blinkRed {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    /* 3. Studio Flash */
    #screen-flash {
      position: absolute;
      inset: 0;
      background-color: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 0.08s ease-out;
    }

    #screen-flash.flash-active {
      opacity: 1;
      transition: none;
    }

    /* 4. Processing Spinner */
    #screen-processing {
      display: none;
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(12px);
      z-index: 30;
    }

    .spinner {
      width: 70px;
      height: 70px;
      border: 5px solid rgba(244, 63, 94, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .processing-text {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.5px;
    }

    /* 5. Result & QR Screen */
    #screen-result {
      display: none;
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      z-index: 40;
      padding: 40px;
    }

    .result-container {
      width: 100%;
      max-width: 1200px;
      height: 90vh;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .result-photo-card {
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 2px solid var(--card-border);
      border-radius: 28px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    #result-photo-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .result-action-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 36px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .qr-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fb7185;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }

    .qr-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .qr-desc {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .qr-frame {
      background: #ffffff;
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 240px;
      height: 240px;
    }

    #qr-canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .auto-reset-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    #reset-progress {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #f43f5e, #06b6d4);
      transition: width 1s linear;
    }

    .btn-next-photo {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      border: none;
      border-radius: 18px;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 10px 25px var(--accent-glow);
      transition: all 0.2s;
    }

    .btn-next-photo:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px var(--accent);
    }
  </style>
</head>
<body>

  <!-- Fullscreen Toggle Button at Top Corner -->
  <button class="btn-fullscreen-toggle" id="btn-fullscreen-toggle" title="Phóng to toàn màn hình">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
    </svg>
    <span>Toàn Màn Hình</span>
  </button>

  <!-- Discreet Exit Button for Operator (Esc key also works) -->
  <button class="discreet-exit-btn" id="btn-close-kiosk" title="Đóng Cửa Sổ (Esc)">&times;</button>

  <!-- Camera Alert Banner (Hidden when camera is working normally) -->
  <div id="camera-alert" class="camera-alert" style="display: none;">
    <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
      <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
      <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995z"/>
    </svg>
    <span>Chưa có tín hiệu camera</span>
  </div>

  <!-- Liveview Stage -->
  <main class="kiosk-stage" id="kiosk-stage">
    <!-- Liveview Container Box constrained to target aspect ratio -->
    <div id="liveview-container-box" class="liveview-container-box">
      <!-- Camera Mirror Stream -->
      <video id="liveview-video" autoplay playsinline muted></video>
      <canvas id="liveview-canvas" style="display: none;"></canvas>
      <img id="live-overlay" alt="Frame Overlay">

      <!-- Subtle Viewfinder Framing Guide -->
      <div class="viewfinder-guide" id="viewfinder-guide">
        <div class="guide-corner tl"></div>
        <div class="guide-corner tr"></div>
        <div class="guide-corner bl"></div>
        <div class="guide-corner br"></div>
      </div>
    </div>

    <!-- 1. Idle Screen: Clean Mirror (tap anywhere or bottom button to shoot) -->
    <div class="screen-overlay" id="screen-idle">
      <div class="bottom-touch-bar">
        <button class="shutter-pill" id="btn-shutter">
          <span class="shutter-icon-dot"></span>
          <span class="shutter-text">Chạm Để Chụp Ảnh</span>
        </button>
      </div>
    </div>

    <!-- 2. Countdown Screen: Positioned at Top-Center to completely clear subjects' faces and pose -->
    <div class="screen-overlay" id="screen-countdown">
      <div class="countdown-wrap">
        <div class="countdown-badge">
          <span class="countdown-number" id="countdown-val">3</span>
        </div>
        <div class="countdown-subtext">
          <span class="lens-indicator-dot"></span>
          <span>Cười lên nào! ✨</span>
        </div>
      </div>
    </div>

    <!-- 3. Studio Flash Effect -->
    <div id="screen-flash"></div>

    <!-- 4. Processing Screen -->
    <div class="screen-overlay" id="screen-processing">
      <div class="spinner"></div>
      <div class="processing-text">Đang hoàn thiện ảnh của bạn...</div>
    </div>

    <!-- 5. Result Screen -->
    <div class="screen-overlay" id="screen-result">
      <div class="result-container">
        <div class="result-photo-card">
          <img id="result-photo-img" src="" alt="Photo Result">
        </div>
        <div class="result-action-card">
          <div class="qr-badge">✨ Ảnh Đã Sẵn Sàng</div>
          <h2 class="qr-title">Quét Mã Tải Ảnh</h2>
          <p class="qr-desc">Mở camera điện thoại để quét mã QR và tải ảnh gốc về máy</p>

          <div class="qr-frame">
            <canvas id="qr-canvas"></canvas>
          </div>

          <div class="auto-reset-bar">
            <div id="reset-progress"></div>
          </div>

          <button class="btn-next-photo" id="btn-done-photo">
            <span>Chụp Thêm Lượt Nữa</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="./src/renderer/kiosk.js" type="module"></script>
</body>
</html>
