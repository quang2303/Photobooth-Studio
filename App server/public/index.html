<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Booth Cloud - Tham Gia Phòng Chụp</title>
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 60%, #020617 100%);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between items-center p-6">

  <!-- Header -->
  <header class="w-full max-w-6xl flex justify-between items-center py-4">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-rose-500 to-rose-700 flex items-center justify-center shadow-lg shadow-rose-500/20">
        <svg class="w-4 h-4 fill-white" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
        </svg>
      </div>
      <span class="text-xl font-bold tracking-wide bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">PhotoBooth Cloud</span>
    </div>
    
    <a href="/admin.html" class="text-sm font-medium text-slate-400 hover:text-rose-400 transition-colors flex items-center gap-1.5 bg-slate-800/40 hover:bg-slate-800/80 border border-slate-700/50 px-4 py-2 rounded-full backdrop-blur">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
      </svg>
      Admin Panel
    </a>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-md flex flex-col justify-center my-auto py-12">
    <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-8 backdrop-blur-xl shadow-2xl relative overflow-hidden">
      <!-- Ambient light effect -->
      <div class="absolute -top-24 -left-24 w-48 h-48 bg-rose-500/10 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-violet-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-slate-100 mb-2">Vào Phòng Chụp Ảnh</h2>
        <p class="text-sm text-slate-400">Nhập tên phòng do người vận hành (admin) cung cấp để tham gia xem trực tiếp và chụp ảnh.</p>
      </div>

      <form id="join-form" class="space-y-6">
        <div>
          <label for="room-input" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Tên Phòng</label>
          <input 
            type="text" 
            id="room-input" 
            required 
            placeholder="Ví dụ: wedding-party" 
            class="w-full bg-slate-950/80 border border-slate-800 focus:border-rose-500 focus:ring-1 focus:ring-rose-500 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-600 outline-none transition duration-200"
          >
          <div id="error-message" class="text-xs text-rose-400 mt-2 hidden"></div>
        </div>

        <button 
          type="submit" 
          class="w-full py-3.5 bg-gradient-to-r from-rose-500 to-rose-600 hover:from-rose-600 hover:to-rose-700 text-white font-semibold rounded-xl transition duration-200 shadow-lg shadow-rose-500/25 flex justify-center items-center gap-2"
        >
          Tham Gia Phòng
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path>
          </svg>
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full text-center text-xs text-slate-500 py-6 border-t border-slate-900">
    &copy; 2026 PhotoBooth Sync System. Mọi quyền được bảo lưu.
  </footer>

  <script>
    const form = document.getElementById('join-form');
    const input = document.getElementById('room-input');
    const errorDiv = document.getElementById('error-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const roomName = input.value.trim().toLowerCase();
      if (!roomName) return;

      errorDiv.classList.add('hidden');

      try {
        const response = await fetch(`/api/rooms-data/${roomName}`);
        if (response.ok) {
          // Redirect to liveview page
          window.location.href = `/room/${roomName}`;
        } else {
          errorDiv.textContent = 'Phòng chụp này không tồn tại hoặc đã bị xóa. Vui lòng thử lại!';
          errorDiv.classList.remove('hidden');
        }
      } catch (err) {
        errorDiv.textContent = 'Không thể kết nối đến máy chủ. Vui lòng kiểm tra lại mạng!';
        errorDiv.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
